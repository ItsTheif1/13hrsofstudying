<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <link href="https://fonts.googleapis.com/css2?family=Schoolbell&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --teal: #00d9ff;
      --teal-dark: #007a8c;
      --bg: linear-gradient(135deg, #0a1929 0%, #132f4c 50%, #0d2d4f 100%);
      --card: rgba(255, 255, 255, 0.05);
      --text: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      background: radial-gradient(
        circle at 20% 50%,
        rgba(0, 217, 255, 0.1) 0%,
        transparent 50%
      ),
      radial-gradient(
        circle at 80% 80%,
        rgba(0, 217, 255, 0.05) 0%,
        transparent 50%
      );
      animation: drift 8s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes drift {
      0%, 100% {
        transform: translate(0, 0);
      }
      50% {
        transform: translate(30px, 30px);
      }
    }

    .container {
      max-width: 600px;
      text-align: center;
      position: relative;
      z-index: 1;
      background: var(--card);
      backdrop-filter: blur(10px);
      padding: 60px 40px;
      border-radius: 20px;
      border: 1px solid rgba(0, 217, 255, 0.2);
      box-shadow: 0 8px 32px rgba(0, 217, 255, 0.1);
    }

    .error-code {
      font-size: 120px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--teal) 0%, rgba(0, 217, 255, 0.6) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 20px;
      text-shadow: 0 0 30px rgba(0, 217, 255, 0.3);
    }

    .error-title {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 15px;
      color: var(--text);
    }

    .error-desc {
      font-size: 16px;
      color: var(--text-muted);
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .button-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      padding: 12px 32px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--teal) 0%, rgba(0, 217, 255, 0.8) 100%);
      color: #0a1929;
      box-shadow: 0 4px 15px rgba(0, 217, 255, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(0, 217, 255, 0.4);
    }

    .btn-secondary {
      background: transparent;
      color: var(--teal);
      border: 2px solid var(--teal);
    }

    .btn-secondary:hover {
      background: rgba(0, 217, 255, 0.1);
      transform: translateY(-2px);
    }

    .emoji {
      font-size: 80px;
      margin-bottom: 20px;
      display: inline-block;
      animation: bounce 2s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-20px);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">🎮</div>
    <div class="error-code">404</div>
    <div class="error-title">Page Not Found</div>
    <p class="error-desc">Oops! Looks like you've ventured into uncharted territory. The page you're looking for doesn't exist or has been moved.</p>
    <div class="button-group">
      <a href="/" class="btn btn-primary">Back to Home</a>
      <a href="/index.html" class="btn btn-secondary">Return to 13</a>
    </div>
  </div>
</body>
</html>
